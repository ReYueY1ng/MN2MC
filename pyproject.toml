[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mn2mc"
version = "0.1.0"
description = "Protocol translation proxy between Mini World and Minecraft"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["mn2mc/mini/proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["mn2mc"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["mn2mc", "tests"]
exclude = ["mn2mc/mini/proto"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
possibly-missing-import = "warn"
unused-ignore-comment = "warn"
